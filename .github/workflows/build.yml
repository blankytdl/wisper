
name: Build WhisperDesktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Visual Studio 2026 MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[18.0,19.0)'

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Verify C++ toolset
        shell: pwsh
        run: |
          $vs = & vswhere.exe -latest -version '[18.0,19.0)' `
            -property installationPath
          if (-not $vs) {
            throw "Visual Studio 2026 was not found."
          }
          Write-Host "Visual Studio: $vs"
          $toolset = Join-Path $vs 'VC\Tools\MSVC'
          Get-ChildItem $toolset -Directory |
            Select-Object -ExpandProperty Name

      - name: Restore NuGet packages
        run: nuget restore WhisperCpp.sln

      - name: Build Release x64
        run: >
          msbuild WhisperCpp.sln
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:RestorePackagesConfig=true
          /verbosity:minimal

      - name: Upload build outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WhisperDesktop-Windows-x64-Release
          path: |
            **/bin/x64/Release/**
            **/x64/Release/**
          if-no-files-found: warn
          retention-days: 14
