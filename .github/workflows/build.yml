name: Build WhisperDesktop

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: Find solution
        id: solution
        shell: pwsh
        run: |
          $s = Get-ChildItem . -Recurse -Filter *.sln |
            Where-Object { $_.FullName -notmatch '\\(bin|obj|\.git)\\' } |
            Select-Object -First 1

          if (-not $s) { throw "No Visual Studio solution found." }

          "path=$($s.FullName)" >> $env:GITHUB_OUTPUT

      - name: Restore packages
        run: nuget restore "${{ steps.solution.outputs.path }}"

      - name: Build Release x64
        run: msbuild "${{ steps.solution.outputs.path }}" /m /p:Configuration=Release /p:Platform=x64 /p:RestorePackagesConfig=true /verbosity:minimal

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: WhisperDesktop-Windows-x64-Release
          path: |
            **/Release/**/*.exe
            **/Release/**/*.dll
            **/x64/Release/**/*.exe
            **/x64/Release/**/*.dll
          if-no-files-found: error
          retention-days: 14
