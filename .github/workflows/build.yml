
name: Build WhisperDesktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build WhisperDesktop (Windows x64)
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[18.0,19.0)'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Verify required source files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $required = @(
            'WhisperCpp.sln',
            'ComputeShaders\ComputeShaders.vcxproj',
            'Tools\CompressShaders\CompressShaders.csproj',
            'Whisper\D3D\shaders.cpp'
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required file not found: $file"
            }
            Write-Host "Found: $file"
          }

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          nuget restore WhisperCpp.sln
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet restore failed."
          }

      - name: Build ComputeShaders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          msbuild ComputeShaders\ComputeShaders.vcxproj `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "ComputeShaders build failed."
          }

      - name: Verify compiled shader binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $shaderDir = Join-Path $PWD 'ComputeShaders\x64\Release'

          if (-not (Test-Path $shaderDir)) {
            throw "Shader output directory was not created: $shaderDir"
          }

          $shaders = @(Get-ChildItem $shaderDir -Filter '*.cso' -File)

          Write-Host "Compiled shader count: $($shaders.Count)"

          if ($shaders.Count -eq 0) {
            throw "No .cso shader binaries were generated."
          }

          $shaders | Select-Object -First 10 -ExpandProperty Name

      - name: Generate shader source files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          dotnet run `
            --project Tools\CompressShaders\CompressShaders.csproj `
            --configuration Release

          if ($LASTEXITCODE -ne 0) {
            throw "CompressShaders failed."
          }

      - name: Verify generated shader files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $required = @(
            'Whisper\D3D\shaderData-Release.inl',
            'Whisper\D3D\shaderNames.h',
            'Whisper\D3D\shaderNames.cpp'
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Shader generator did not create: $file"
            }

            if ((Get-Item $file).Length -eq 0) {
              throw "Generated file is empty: $file"
            }

            Write-Host "Generated: $file"
          }

      - name: Build WhisperCpp solution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          msbuild WhisperCpp.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RestorePackagesConfig=true `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "WhisperCpp.sln build failed."
          }

      - name: List build outputs
        if: success()
        shell: pwsh
        run: |
          Write-Host "Searching for executable and library outputs..."

          Get-ChildItem -Path . -Recurse -File |
            Where-Object {
              $_.Extension -in @('.exe', '.dll', '.lib')
            } |
            Where-Object {
              $_.FullName -match '\\(x64|bin)\\Release\\'
            } |
            Select-Object -ExpandProperty FullName

      - name: Upload Windows x64 build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WhisperDesktop-Windows-x64-Release
          path: |
            **/x64/Release/**
            **/bin/Release/**
            **/bin/x64/Release/**
          if-no-files-found: warn
          retention-days: 14
