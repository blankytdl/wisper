
      - name: Generate shader data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Searching for shader generation tools..."
          Get-ChildItem -Recurse -File |
            Where-Object {
              $_.Name -match 'CompressShaders|shaderData-Release\.inl'
            } |
            Select-Object -ExpandProperty FullName

          $project = Get-ChildItem -Recurse -Filter '*CompressShaders*.csproj' |
            Select-Object -First 1

          if (-not $project) {
            throw "Shader generator project not found. Inspect the repository's Tools folder."
          }

          dotnet build $project.FullName -c Release

          $generator = Get-ChildItem $project.Directory.FullName `
            -Recurse -Filter 'CompressShaders.exe' |
            Select-Object -First 1

          if (-not $generator) {
            throw "CompressShaders.exe not found after building the generator."
          }

          & $generator.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Shader generator failed with exit code $LASTEXITCODE"
          }
